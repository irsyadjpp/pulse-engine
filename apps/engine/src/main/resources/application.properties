# =============================================================================
# Pulse Engine — Application Configuration (Docker Profile)
# =============================================================================

# Quarkus
quarkus.application.name=pulse-engine
quarkus.application.version=1.0.0

# HTTP
quarkus.http.port=7020

# OpenAPI / Swagger Documentation
quarkus.smallrye-openapi.info.title=Pulse Engine API
quarkus.smallrye-openapi.info.version=1.0.0
quarkus.smallrye-openapi.info.description=Intelligent decision layer for checkout processing. \
  Pulse Engine continuously understands every checkout event and decides what should happen next. \
  This service processes checkout events through five core capabilities: Observe, Understand, Decide, Explain, and Learn.
quarkus.smallrye-openapi.info.contact-email=pulse-engine@irsyad.com
quarkus.smallrye-openapi.info.contact-name=Pulse Engine Team
quarkus.smallrye-openapi.info.license-name=Apache 2.0
quarkus.smallrye-openapi.info.license-url=https://www.apache.org/licenses/LICENSE-2.0.html
quarkus.smallrye-openapi.info.terms-of-service-url=https://irsyad.com/terms
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.ui-path=/q/swagger-ui

# Health
quarkus.smallrye-health.root-path=/q/health

# Kafka (Docker network)
kafka.bootstrap.servers=kafka:9092

# ---- Incoming: pulse.checkout.completed.v1 (Consumer) ----
mp.messaging.incoming.checkout.completed.connector=smallrye-kafka
mp.messaging.incoming.checkout.completed.topic=pulse.checkout.completed.v1
mp.messaging.incoming.checkout.completed.group.id=pulse-engine
mp.messaging.incoming.checkout.completed.auto.offset.reset=earliest
mp.messaging.incoming.checkout.completed.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
mp.messaging.incoming.checkout.completed.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.checkout.completed.retry-attempts=3
mp.messaging.incoming.checkout.completed.retry-max-delay=10000
mp.messaging.incoming.checkout.completed.enable-dlq=true
mp.messaging.incoming.checkout.completed.dlq-topic=pulse.checkout.completed.dlq

# ---- Outgoing: pulse.insight.generated.v1 (Producer) ----
mp.messaging.outgoing.insight.generated.connector=smallrye-kafka
mp.messaging.outgoing.insight.generated.topic=pulse.insight.generated.v1
mp.messaging.outgoing.insight.generated.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.insight.generated.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Datasource (Docker network)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/pulse
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=pulse_engine
quarkus.flyway.table=flyway_engine_history

# Hibernate
quarkus.hibernate-orm.database.generation=validate

# Micrometer
quarkus.micrometer.export.prometheus.enabled=true