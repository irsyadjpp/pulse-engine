# =============================================================================
# Pulse Orchestrator — Quarkus Application Configuration
# =============================================================================

# Application
quarkus.application.name=orchestrator
quarkus.banner.enabled=false

# HTTP Server
quarkus.http.port=7021
quarkus.http.host=0.0.0.0

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:7002/pulse
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.default-schema=orchestrator

# Kafka Configuration
kafka.bootstrap.servers=localhost:7000
mp.messaging.outgoing.checkout-event.connector=smallrye-kafka
mp.messaging.outgoing.checkout-event.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.checkout-event.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.checkout-event.acks=all
mp.messaging.outgoing.checkout-event.enable.idempotence=true
mp.messaging.outgoing.checkout-event.retries=3
mp.messaging.outgoing.checkout-event.compression.type=snappy

mp.messaging.incoming.checkout-request.connector=smallrye-kafka
mp.messaging.incoming.checkout-request.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.checkout-request.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.checkout-request.group.id=orchestrator-group
mp.messaging.incoming.checkout-request.auto.offset.reset=earliest
mp.messaging.incoming.checkout-request.enable.auto.commit=false

# External Service URLs (Local development)
customer.service.url=http://localhost:7010
dukcapil.service.url=http://localhost:7011
velocity.service.url=http://localhost:7012
fraud.service.url=http://localhost:7013
checkout.service.url=http://localhost:7014
payment.service.url=http://localhost:7015
kyc.service.url=http://localhost:7016
inventory.service.url=http://localhost:7017
liveness.service.url=http://localhost:7018
policy.service.url=http://localhost:7019
merchant.service.url=http://localhost:7020
product.service.url=http://localhost:7022

# Redis Configuration
quarkus.redis.hosts=redis://localhost:7001
quarkus.redis.timeout=5s

# REST Client Configurations
customer-service/mp-rest/url=${customer.service.url}
customer-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

dukcapil-service/mp-rest/url=${dukcapil.service.url}
dukcapil-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

velocity-service/mp-rest/url=${velocity.service.url}
velocity-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

fraud-service/mp-rest/url=${fraud.service.url}
fraud-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

checkout-service/mp-rest/url=${checkout.service.url}
checkout-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

merchant-service/mp-rest/url=${merchant.service.url}
merchant-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

product-service/mp-rest/url=${product.service.url}
product-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

liveness-service/mp-rest/url=${liveness.service.url}
liveness-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

policy-service/mp-rest/url=${policy.service.url}
policy-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

payment-service/mp-rest/url=${payment.service.url}
payment-service/mp-rest/scope=jakarta.enterprise.context.ApplicationScoped

# Outgoing channel for checkout-completed events
mp.messaging.outgoing.checkout-completed-out.connector=smallrye-kafka
mp.messaging.outgoing.checkout-completed-out.topic=pulse.checkout.completed.v1
mp.messaging.outgoing.checkout-completed-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.checkout-completed-out.enable.idempotence=true
mp.messaging.outgoing.checkout-completed-out.acks=all
mp.messaging.outgoing.checkout-completed-out.retries=3

# Incoming channel for checkout-retry events
mp.messaging.incoming.checkout-retry.connector=smallrye-kafka
mp.messaging.incoming.checkout-retry.topic=pulse.checkout.retry.v1
mp.messaging.incoming.checkout-retry.group.id=orchestrator-retry-group
mp.messaging.incoming.checkout-retry.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.checkout-retry.auto.offset.reset=earliest
mp.messaging.incoming.checkout-retry.enable.auto.commit=false

# Incoming channel for checkout-retry-handler events
mp.messaging.incoming.checkout-retry-handler.connector=smallrye-kafka
mp.messaging.incoming.checkout-retry-handler.topic=pulse.checkout.retry.v1
mp.messaging.incoming.checkout-retry-handler.group.id=orchestrator-retry-handler
mp.messaging.incoming.checkout-retry-handler.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.checkout-retry-handler.auto.offset.reset=earliest
mp.messaging.incoming.checkout-retry-handler.enable.auto.commit=false

# Incoming channel for checkout-cancel events
mp.messaging.incoming.checkout-cancel.connector=smallrye-kafka
mp.messaging.incoming.checkout-cancel.topic=pulse.checkout.cancel.v1
mp.messaging.incoming.checkout-cancel.group.id=orchestrator-cancel-handler
mp.messaging.incoming.checkout-cancel.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.checkout-cancel.auto.offset.reset=earliest
mp.messaging.incoming.checkout-cancel.enable.auto.commit=false

# MicroProfile Fault Tolerance (SmallRye) — configurable overrides
# Circuit breaker and timeout values below override the @CircuitBreaker/@Timeout
# annotation defaults at runtime without code changes. Key = FQCN/methodName.
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.customer.CustomerService/getPolicyholderInfo".circuit-breaker.request-volume-threshold=5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.customer.CustomerService/getPolicyholderInfo".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.customer.CustomerService/getPolicyholderInfo".circuit-breaker.delay=30000
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.customer.CustomerService/getPolicyholderInfo".timeout.value=10000

quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.dukcapil.DukcapilService/verifyIdentity".circuit-breaker.request-volume-threshold=3
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.dukcapil.DukcapilService/verifyIdentity".circuit-breaker.failure-ratio=0.6
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.dukcapil.DukcapilService/verifyIdentity".circuit-breaker.delay=45000
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.dukcapil.DukcapilService/verifyIdentity".timeout.value=10000

quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.velocity.VelocityService/getVelocityScore".circuit-breaker.request-volume-threshold=5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.velocity.VelocityService/getVelocityScore".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.velocity.VelocityService/getVelocityScore".circuit-breaker.delay=30000
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.velocity.VelocityService/getVelocityScore".timeout.value=10000

quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.fraud.FraudService/getFraudScore".circuit-breaker.request-volume-threshold=5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.fraud.FraudService/getFraudScore".circuit-breaker.failure-ratio=0.4
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.fraud.FraudService/getFraudScore".circuit-breaker.delay=60000
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.fraud.FraudService/getFraudScore".timeout.value=10000

quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.policy.PolicyService/getTotalActiveUP".circuit-breaker.request-volume-threshold=5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.policy.PolicyService/getTotalActiveUP".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.policy.PolicyService/getTotalActiveUP".circuit-breaker.delay=30000
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.policy.PolicyService/getTotalActiveUP".timeout.value=5000

quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.liveness.LivenessService/checkLiveness".circuit-breaker.request-volume-threshold=5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.liveness.LivenessService/checkLiveness".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.liveness.LivenessService/checkLiveness".circuit-breaker.delay=30000
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.liveness.LivenessService/checkLiveness".timeout.value=5000

quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.MerchantService/getMerchant".circuit-breaker.request-volume-threshold=5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.MerchantService/getMerchant".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.MerchantService/getMerchant".circuit-breaker.delay=30000
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.MerchantService/getMerchant".timeout.value=5000

quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.ProductService/getProduct".circuit-breaker.request-volume-threshold=5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.ProductService/getProduct".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.ProductService/getProduct".circuit-breaker.delay=30000
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.ProductService/getProduct".timeout.value=5000

quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.CheckoutCalculationService/calculateAmount".circuit-breaker.request-volume-threshold=5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.CheckoutCalculationService/calculateAmount".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.CheckoutCalculationService/calculateAmount".circuit-breaker.delay=30000
quarkus.fault-tolerance."com.irsyad.pulse.orchestrator.integration.checkout.CheckoutCalculationService/calculateAmount".timeout.value=10000

# Health & Metrics
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.check.enabled=true
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=prometheus

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.irsyad.pulse".level=DEBUG

# Kogito Decisions Configuration
# Ignore DMN validation at build time to allow FEEL expressions that reference
# process variables defined in the BPMN process model (e.g., customerType, identityStatus)
kogito.decisions.validation=IGNORE

# Disable Kogito Dev Services (Docker image not available)
quarkus.kogito.devservices.enabled=false
quarkus.messaging.kafka.health-check-enabled=false
quarkus.smallrye-health.kafka.enabled=false