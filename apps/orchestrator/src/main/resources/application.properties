resilience4j.bulkhead.configs.default.max-wait-duration=5s

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.irsyad.pulse".level=DEBUG
quarkus.log.category."io.github.resilience4j".level=DEBUG

# Kogito Decisions Configuration
# Ignore DMN validation at build time to allow FEEL expressions that reference
# process variables defined in the BPMN process model (e.g., customerType, identityStatus)
kogito.decisions.validation=IGNORE

# Disable Kogito Dev Services (Docker image not available)
quarkus.kogito.devservices.enabled=false
quarkus.messaging.kafka.health-check-enabled=false
quarkus.smallrye-health.kafka.enabled=false