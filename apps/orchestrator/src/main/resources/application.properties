resilience4j.circuitbreaker.instances.fraudService.slow-call-duration-threshold=4s

resilience4j.circuitbreaker.instances.checkoutService.base-config=default
resilience4j.circuitbreaker.instances.checkoutService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.checkoutService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.checkoutService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.checkoutService.slow-call-duration-threshold=3s

resilience4j.circuitbreaker.instances.paymentService.base-config=default
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.paymentService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.slow-call-duration-threshold=3s

resilience4j.timelimiter.configs.default.timeout-duration=10s
