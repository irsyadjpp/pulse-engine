resilience4j.circuitbreaker.instances.dukcapilService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.dukcapilService.slow-call-rate-threshold=70
resilience4j.circuitbreaker.instances.dukcapilService.slow-call-duration-threshold=3s

resilience4j.circuitbreaker.instances.velocityService.base-config=default
resilience4j.circuitbreaker.instances.velocityService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.velocityService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.velocityService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.velocityService.slow-call-duration-threshold=2s

resilience4j.circuitbreaker.instances.fraudService.base-config=default
resilience4j.circuitbreaker.instances.fraudService.failure-rate-threshold=40
resilience4j.circuitbreaker.instances.fraudService.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.fraudService.sliding-window-size=15
